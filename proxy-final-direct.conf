# Shadowrocket: 2026-07-31
# ============================================================
# 结构（自上而下匹配，先命中先生效）:
#   [1] 内网穿透   ZeroTier 网段 → 自有 VPS（内网穿透 组）
#   [2] 拦截       广告 + 运营商劫持（Lite 版，误杀率低）
#   [3] 自定义     工作域名 + 自定义中转（raft.build / multica.ai / cloudsway.net）
#   [4] AI 服务    Claude / OpenAI / Gemini / Grok / Copilot / Cursor / HuggingFace 等
#                  → 自有 VPS（固定出口 IP 降风控，清单与 clash-Rules.js 同源）
#                  末尾附国内 AI → DIRECT + PT 站点 → DIRECT
#   [5] 分流服务   X / YouTube / Netflix / Disney / HBO / PrimeVideo / Google /
#                  游戏 / GitHub / Docker → 全球加速（与 clash 的 GEOSITE 分流对应）
#   [6] Telegram   纯 IP 通信，域名规则接不住，必须按 IP 段分流 → 全球加速
#   [7] 全球加速   Global 列表 → 全球加速
#   [8] 兜底       FINAL → 兜底分流（默认 DIRECT）
#
# 维护提示:
#   - 规则列表走 jsdelivr 镜像（国内可直连更新）；镜像同步有约半天延迟，
#     介意可换回 raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/...
#   - 广告拦截出问题：删掉 [2] 两行即可
#   - Gemini / Copilot 不用可删
# ============================================================

[General]
fallback-dns-server = 223.5.5.5, 119.29.29.29
private-ip-answer = true
prefer-ipv6 = false
bypass-system = true
dns-server = system
# skip-proxy 是硬旁路（跳过规则强制直连，无例外机制）：
# 故意不含 10.0.0.0/8 和 192.168.0.0/16 —— ZeroTier 三个网段在里面，加了内网穿透就断；
# 普通局域网流量由 tun-excluded-routes 在路由层挡住，不依赖这里
skip-proxy = 127.0.0.1, 169.254.0.0/16, 172.16.0.0/12, 100.64.0.0/10, localhost, *.local, captive.apple.com, *.crashlytics.com, *.edu.cn
# ZeroTier 内网段精确打洞进 TUN；其余 192.168.x / 10.x 仍完全绕过（与默认行为一致）
tun-included-routes = 192.168.192.0/24, 10.21.0.0/16, 192.168.20.0/24
tun-excluded-routes = 10.0.0.0/8,100.64.0.0/10,127.0.0.0/8,169.254.0.0/16,172.16.0.0/12,192.0.0.0/24,192.0.2.0/24,192.88.99.0/24,192.168.0.0/16,198.18.0.0/15,198.51.100.0/24,203.0.113.0/24,224.0.0.0/4,255.255.255.255/32
ipv6 = true


[Proxy Group]
# select = 手动选择，App 里点一下即切；列表首个成员为默认值
# ⚠ 自有VPS 靠正则匹配你手动添加的节点（名字含 oracle-us）。
#   导入后先点开这个组确认里面有节点 —— 空的说明正则没匹配上，
#   把 oracle 换成节点名里的其它关键词即可。
# 内网穿透专用：必须钉死在加入了 ZeroTier 的那台。
# ⚠ 绝不能用 url-test —— 其它自有节点没加入 ZeroTier，被自动选中后
#   内网会静默不通（代理连得上，但访问不到内网设备）。
# 带 DIRECT 显式成员是为了保证组一定能渲染出来；正则匹配到的节点排在它后面，
# 所以导入后必须进 App 手动把这个组切到 oracle-us 那个节点（默认是 DIRECT）。
内网穿透 = select,DIRECT,policy-regex-filter=(?i)oracle[-_ ]?us
# AI 专用：同样带显式成员保证渲染。只有一台自有节点时 select 足够；
# 将来加了第二台想要自动故障切换，把 select 改成 fallback 即可。
自有VPS = select,DIRECT,policy-regex-filter=(?i)oracle
全球加速 = select,自动选择,DIRECT,香港节点,日本节点,台湾节点,美国节点,狮城节点,interval=86400,timeout=3,select=0,url=http://1.1.1.1/generate_204
兜底分流 = select,DIRECT,自动选择,香港节点,日本节点,台湾节点,美国节点,狮城节点,interval=86400,timeout=3,select=0,url=http://1.1.1.1/generate_204
# X（Twitter）独立开关：默认跟随全球加速；临时直连/换区在面板里切。
# 与 clash-Rules.js 的 X 组对应，避免每次都要连坐改全局分组。
X = select,全球加速,自动选择,香港节点,日本节点,台湾节点,美国节点,狮城节点,DIRECT

# 自动测速组：节点由正则从订阅里筛，机场改名/换节点都不用动配置
# ⚠ 每组都排除 oracle —— 那台是个人小机器，不该被随机挑中承载普通流量
自动选择 = url-test,policy-regex-filter=(?i)^(?!.*(oracle|过期|剩余|官网|试用|流量|到期)).*$,url=http://1.1.1.1/generate_204,interval=300,tolerance=50,timeout=3,select=0
香港节点 = url-test,policy-regex-filter=(?i)^(?!.*oracle)(?=.*(🇭🇰|香港|\b(HK|Hong)\b)).*$,url=http://1.1.1.1/generate_204,interval=300,tolerance=50,timeout=3,select=0
台湾节点 = url-test,policy-regex-filter=(?i)^(?!.*oracle)(?=.*(🇹🇼|台湾|\b(TW|Taiwan)\b)).*$,url=http://1.1.1.1/generate_204,interval=300,tolerance=50,timeout=3,select=0
日本节点 = url-test,policy-regex-filter=(?i)^(?!.*oracle)(?=.*(🇯🇵|日本|东京|\b(JP|Japan)\b)).*$,url=http://1.1.1.1/generate_204,interval=300,tolerance=50,timeout=3,select=0
美国节点 = url-test,policy-regex-filter=(?i)^(?!.*oracle)(?=.*(🇺🇸|美国|洛杉矶|圣何塞|\b(US|United States)\b)).*$,url=http://1.1.1.1/generate_204,interval=300,tolerance=50,timeout=3,select=0
狮城节点 = url-test,policy-regex-filter=(?i)^(?!.*oracle)(?=.*(🇸🇬|新加坡|狮城|\b(SG|Singapore)\b)).*$,url=http://1.1.1.1/generate_204,interval=300,tolerance=50,timeout=3,select=0

[Rule]
# ───── [1] 内网穿透：出口必须是加入了 ZeroTier 的 Oracle VPS ─────
# （内网穿透 组切到其它节点时内网会不通）
IP-CIDR,192.168.192.0/24,内网穿透,no-resolve
IP-CIDR,10.21.0.0/16,内网穿透,no-resolve
IP-CIDR,192.168.20.0/24,内网穿透,no-resolve
# 局域网兜底：正常情况下这些网段不进 TUN（被 tun-excluded-routes 排除），
# 这里保证以后调整 excluded 名单时，局域网流量依旧直连而不是掉进 FINAL/代理
IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
IP-CIDR,127.0.0.0/8,DIRECT,no-resolve

