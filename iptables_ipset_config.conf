#!/bin/bash
#################################################
# iptables_ipset_config.conf
# iptables-ipset-operator.sh 的配置文件
# 支持 IPv4 + IPv6 双栈
#################################################

#################################################
# 白名单模式配置 (whitelist mode)
#
# 注意：这里的网段是按【报文来源地址】匹配的，命中即放行。
# 因此只应填写你确实信任、且不可能被伪造的来源；
# 组播、保留、文档前缀、隧道前缀等不会作为正常来源出现，
# 一旦写进来就等于给伪造源地址的报文开了后门。
#################################################

# 允许访问的 IPv4 网络/IP地址列表
ALLOWED_NETWORKS=(
    "127.0.0.0/8"           # 本机回环
    "10.0.0.0/8"            # 内网 A 类
    "172.16.0.0/12"         # 内网 B 类
    "192.168.0.0/16"        # 内网 C 类
    "169.254.0.0/16"        # DHCP 失败自动分配
    "100.64.0.0/10"         # 运营商 NAT（如无需要建议注释掉）
    #"1.2.3.4/32"           # 示例：放行单个公网 IP

    # 以下为反面示例，请勿启用：
    #"224.0.0.0/4"          # 组播：不会作为来源地址出现，放行=接受伪造源
    #"240.0.0.0/4"          # 保留：同上
)

# 允许访问的 IPv6 网络/IP地址列表
ALLOWED_NETWORKS_V6=(
    "::1/128"               # 本机回环
    "fe80::/10"             # 链路本地地址
    "fc00::/7"              # 唯一本地地址 (ULA)

    # 以下为反面示例，请勿启用：
    #"2001:db8::/32"        # 文档前缀：真实流量不会用它
    #"ff00::/8"             # 多播：不会作为来源地址出现
    #"2001::/32"            # Teredo 隧道：等于放行任意隧道来源
    #"2002::/16"            # 6to4 隧道：同上
)

# 白名单模式下对所有 IP 开放的端口（空格分隔）
# ⚠️ 必须包含 SSH 端口，否则应用规则后会断开自己的连接。
#    脚本带有 SSH 锁定保护，检测到风险会中止并提示。
whitelist_ports="22 80 443"

#################################################
# 受限端口模式配置 (restricted mode)
#################################################

# 需要封禁的端口列表（空格分隔）
# 这些端口将被 DROP，其他端口默认放行
restricted_ports="3306 6379 27017 5432 9200 11211"
