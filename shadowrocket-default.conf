# Shadowrocket · 中国大陆主配置  ——  2026-08-03
# 由 proxy-final-direct.conf + direct-final-proxy.conf 合并而来，一份顶两份
# ============================================================
# 黑白名单靠 App 里切「兜底分流」一个下拉菜单，不用换配置文件：
#
#   兜底分流 选 DIRECT    → 黑名单模式：命中 Global 才代理，其余直连
#                          （省流、看国内视频、VPS 抽风时的应急）
#   兜底分流 选 自动选择   → 白名单模式：命中 ChinaMax 才直连，其余全代理
#                          （日常推荐：漏网只是慢一点，不会打不开）
#
#   另外两个组也可手动切：
#   全球加速 —— 境外流量出口，可指定地区节点
#   内网穿透 / 自有VPS —— 固定指向自己的 Oracle 机器，正常不用动
#
# 规则顺序（自上而下，先命中先生效）:
#   [1] 内网穿透   ZeroTier 网段 → 内网穿透 组；局域网 → DIRECT
#   [2] 拦截       广告 + 运营商劫持
#   [3] 自定义     工作域名
#   [4] AI 服务    Claude / OpenAI / Gemini / Copilot → 自有VPS（固定出口 IP 降风控）
#   [5] Telegram   纯 IP 通信，域名规则接不住，必须按 IP 段分流
#   [6] 全球加速   Global 列表 → 全球加速
#   [7] 国内直连   ChinaMax 列表 → DIRECT（必须排在 Global 之后）
#   [8] 兜底       FINAL → 兜底分流
#
# 维护提示:
#   - 列表走 jsdelivr 镜像（国内可直连更新，同步延迟约半天）
#   - 广告拦截出问题：删掉 [2] 两行
#   - Gemini / Copilot 不用可删
#   - 香港环境请改用 hk-final-direct.conf（DNS、IPv6、AI 绕行理由都不同，刻意不合并）
# ============================================================

[General]
fallback-dns-server = 223.5.5.5, 119.29.29.29
private-ip-answer = true
prefer-ipv6 = false
bypass-system = true
dns-server = system
# skip-proxy 是硬旁路（跳过规则强制直连，无例外机制）：
# 故意不含 10.0.0.0/8 和 192.168.0.0/16 —— ZeroTier 三个网段在里面，加了内网穿透就断；
# 普通局域网流量由 tun-excluded-routes 在路由层挡住，不依赖这里
skip-proxy = 127.0.0.1, 169.254.0.0/16, 172.16.0.0/12, 100.64.0.0/10, localhost, *.local, captive.apple.com, *.crashlytics.com, *.edu.cn
# ZeroTier 内网段精确打洞进 TUN；其余 192.168.x / 10.x 仍完全绕过（与默认行为一致）
tun-included-routes = 192.168.192.0/24, 10.21.0.0/16, 192.168.20.0/24
tun-excluded-routes = 10.0.0.0/8,100.64.0.0/10,127.0.0.0/8,169.254.0.0/16,172.16.0.0/12,192.0.0.0/24,192.0.2.0/24,192.88.99.0/24,192.168.0.0/16,198.18.0.0/15,198.51.100.0/24,203.0.113.0/24,224.0.0.0/4,255.255.255.255/32
# 白名单模式下若遇到节点不支持 IPv6 导致的连接失败，把这里改成 false
ipv6 = true

[Proxy Group]
# 内网穿透专用：必须钉死在加入了 ZeroTier 的那台。
# ⚠ 绝不能用 url-test —— 其它自有节点没加入 ZeroTier，被自动选中后
#   内网会静默不通（代理连得上，但访问不到内网设备）。
# 带 DIRECT 显式成员是为了保证组一定能渲染出来（纯正则的 select 组匹配不到就是空的），
# 但 DIRECT 排在第一位是默认值，所以导入后必须手动切到 oracle 节点。
内网穿透 = select,DIRECT,policy-regex-filter=(?i)oracle[-_ ]?us
# AI 专用：同样带显式成员保证渲染。只有一台自有节点时 select 足够；
# 将来加了第二台想要自动故障切换，把 select 改成 fallback 即可。
自有VPS = fallback,DIRECT,policy-regex-filter=(?i)oracle
全球加速 = select,自动选择,DIRECT,香港节点,日本节点,台湾节点,美国节点,狮城节点,interval=86400,timeout=3,select=0,url=http://1.1.1.1/generate_204
# 黑白名单总开关：DIRECT = 黑名单（默认），自动选择 = 白名单
兜底分流 = select,DIRECT,自动选择,香港节点,日本节点,台湾节点,美国节点,狮城节点,interval=86400,timeout=3,select=0,url=http://1.1.1.1/generate_204

# 自动测速组：节点由正则从订阅里筛，机场改名/换节点都不用动配置
# ⚠ 每组都排除 oracle —— 那台是个人小机器，不该被随机挑中承载普通流量
# ⚠ \b 是单词边界，不能省：少了它 Australia / Russia / Belarus 都会被当成美国节点
自动选择 = url-test,policy-regex-filter=(?i)^(?!.*(oracle|过期|剩余|官网|试用|流量|到期)).*$,url=http://1.1.1.1/generate_204,interval=300,tolerance=50,timeout=3,select=0
香港节点 = url-test,policy-regex-filter=(?i)^(?!.*oracle)(?=.*(🇭🇰|香港|\b(HK|Hong)\b)).*$,url=http://1.1.1.1/generate_204,interval=300,tolerance=50,timeout=3,select=0
台湾节点 = url-test,policy-regex-filter=(?i)^(?!.*oracle)(?=.*(🇹🇼|台湾|\b(TW|Taiwan)\b)).*$,url=http://1.1.1.1/generate_204,interval=300,tolerance=50,timeout=3,select=0
日本节点 = url-test,policy-regex-filter=(?i)^(?!.*oracle)(?=.*(🇯🇵|日本|东京|\b(JP|Japan)\b)).*$,url=http://1.1.1.1/generate_204,interval=300,tolerance=50,timeout=3,select=0
美国节点 = url-test,policy-regex-filter=(?i)^(?!.*oracle)(?=.*(🇺🇸|美国|洛杉矶|圣何塞|\b(US|United States)\b)).*$,url=http://1.1.1.1/generate_204,interval=300,tolerance=50,timeout=3,select=0
狮城节点 = url-test,policy-regex-filter=(?i)^(?!.*oracle)(?=.*(🇸🇬|新加坡|狮城|\b(SG|Singapore)\b)).*$,url=http://1.1.1.1/generate_204,interval=300,tolerance=50,timeout=3,select=0

[Rule]
# ───── [1] 内网穿透：出口必须是加入了 ZeroTier 的 Oracle VPS ─────
IP-CIDR,192.168.192.0/24,内网穿透,no-resolve
IP-CIDR,10.21.0.0/16,内网穿透,no-resolve
IP-CIDR,192.168.20.0/24,内网穿透,no-resolve
# 局域网兜底：正常这些网段不进 TUN（被 tun-excluded-routes 排除）。
# 白名单模式下 FINAL 会把流量送去代理，这组规则保证私网流量永远不会被误代理
IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
IP-CIDR,127.0.0.0/8,DIRECT,no-resolve

# ───── [2] 广告 + 运营商劫持拦截（必须在国内直连列表之前） ─────
RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Shadowrocket/AdvertisingLite/AdvertisingLite.list,REJECT,pre-matching
RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Shadowrocket/Hijacking/Hijacking.list,REJECT,pre-matching

# ───── [3] 自定义 / 工作 ─────
DOMAIN-SUFFIX,raft.build,全球加速,pre-matching

# ───── [4] AI 服务 → 自有 VPS ─────
# 维护列表 + 本地兜底：列表拉取失败时下面的手工规则仍然生效
RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Shadowrocket/Claude/Claude.list,自有VPS,pre-matching
DOMAIN-KEYWORD,claude,自有VPS,pre-matching
DOMAIN-SUFFIX,anthropic.com,自有VPS,pre-matching
DOMAIN-SUFFIX,clau.de,自有VPS,pre-matching
DOMAIN,cdn.usefathom.com,自有VPS,pre-matching
IP-CIDR,160.79.104.0/21,自有VPS,no-resolve
IP-CIDR,2607:6BC0::/32,自有VPS,no-resolve
IP-ASN,399358,自有VPS,no-resolve
RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Shadowrocket/OpenAI/OpenAI.list,自有VPS,pre-matching
# Gemini / GitHub Copilot（不用可删）
RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Shadowrocket/Gemini/Gemini.list,自有VPS,pre-matching
RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Shadowrocket/Copilot/Copilot.list,自有VPS,pre-matching

# ───── [5] Telegram：几乎全是无 SNI 的裸 IP 连接，靠 IP 段分流 ─────
RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Shadowrocket/Telegram/Telegram.list,全球加速

# ───── [6] 全球加速（黑名单模式下这是唯一的代理入口，必须够全） ─────
RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Shadowrocket/Global/Global.list,全球加速
DOMAIN-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Shadowrocket/Global/Global_Domain.list,全球加速

# ───── [7] 国内直连（白名单模式下这是唯一的直连入口）─────
# ⚠ 必须排在 Global 之后：两边都收录的域名以 Global 为准，走代理更保险
RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Shadowrocket/ChinaMax/ChinaMax.list,DIRECT
DOMAIN-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Shadowrocket/ChinaMax/ChinaMax_Resolve.list,DIRECT
DOMAIN-SUFFIX,cn,DIRECT
GEOIP,CN,DIRECT

# ───── 可选：屏蔽 QUIC/HTTP3（UDP 443）强制回落 TCP，代理链路通常更稳。
# 白名单模式下大部分流量走代理，启用收益更明显；去掉下一行开头的 # 即可
# AND,((PROTOCOL,UDP),(DST-PORT,443)),REJECT

# ───── [8] 兜底：交给「兜底分流」组，在 App 里切黑/白名单 ─────
FINAL,兜底分流

[MITM]
h2 = false
enable = false
hostname =
ca-passphrase =
ca-p12 =
