# Shadowrocket: 2026-07-31
# ============================================================
# 本 profile：国内白名单直连（ChinaMax），其余全部走代理（FINAL,PROXY）
# 结构（自上而下匹配，先命中先生效）:
#   [1] 内网穿透   ZeroTier 网段 → 自有 VPS（LOCAL-SERVERS）+ 局域网 DIRECT 兜底
#       （本 profile 兜底是 PROXY，私网流量漏进规则引擎会被送去代理，这组兜底更重要）
#   [2] 拦截       广告 + 运营商劫持（放在国内直连列表之前，否则国内广告域名会先被放行）
#   [3] AI 服务    Claude / OpenAI / Gemini / Copilot → 自有 VPS（固定出口 IP 降风控，
#                  不写这些规则它们会掉进 FINAL 跟随选中节点，IP 漂移易触发风控）
#   [4] 国内直连   ChinaMax 列表 → DIRECT
#   [5] 兜底       FINAL,PROXY
#
# 与 proxy-final-direct.conf 的刻意差异:
#   - 无 Telegram / raft.build 规则：它们不在国内列表里，FINAL,PROXY 天然覆盖
#   - ipv6 = false 保持原样（代理为主时关 v6 更省心）
# 维护提示: 列表走 jsdelivr（国内可直连更新，同步延迟约半天）；广告拦截出问题删 [2] 两行
# ============================================================

[General]
fallback-dns-server = 223.5.5.5, 119.29.29.29
private-ip-answer = true
prefer-ipv6 = false
bypass-system = true
dns-server = system
# skip-proxy 是硬旁路（跳过规则强制直连，无例外机制）：
# 故意不含 10.0.0.0/8 和 192.168.0.0/16 —— ZeroTier 三个网段在里面，加了内网穿透就断；
# 普通局域网流量由 tun-excluded-routes 在路由层挡住，不依赖这里
skip-proxy = 127.0.0.1, 169.254.0.0/16, 172.16.0.0/12, 100.64.0.0/10, localhost, *.local, captive.apple.com, *.crashlytics.com, *.edu.cn
# ZeroTier 内网段精确打洞进 TUN；其余 192.168.x / 10.x 仍完全绕过（与默认行为一致）
tun-included-routes = 192.168.192.0/24, 10.21.0.0/16, 192.168.20.0/24
tun-excluded-routes = 10.0.0.0/8,100.64.0.0/10,127.0.0.0/8,169.254.0.0/16,172.16.0.0/12,192.0.0.0/24,192.0.2.0/24,192.88.99.0/24,192.168.0.0/16,198.18.0.0/15,198.51.100.0/24,203.0.113.0/24,224.0.0.0/4,255.255.255.255/32
ipv6 = false

[Rule]
# ───── [1] 内网穿透：出口必须是加入了 ZeroTier 的 Oracle VPS ─────
# （LOCAL-SERVERS 分组切到其它节点时内网会不通）
IP-CIDR,192.168.192.0/24,LOCAL-SERVERS,no-resolve
IP-CIDR,10.21.0.0/16,LOCAL-SERVERS,no-resolve
IP-CIDR,192.168.20.0/24,LOCAL-SERVERS,no-resolve
# 局域网兜底：本 profile 的 FINAL 是 PROXY，这组规则保证私网流量永远不会被送去代理
IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
IP-CIDR,127.0.0.0/8,DIRECT,no-resolve

# ───── [2] 广告 + 运营商劫持拦截（必须在国内直连列表之前） ─────
RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Shadowrocket/AdvertisingLite/AdvertisingLite.list,REJECT,pre-matching
RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Shadowrocket/Hijacking/Hijacking.list,REJECT,pre-matching

# ───── [3] AI 服务 → 自有 VPS ─────
# Claude / Anthropic（维护列表 + 本地兜底：列表拉取失败时下面的手工规则仍然生效）
RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Shadowrocket/Claude/Claude.list,LOCAL-SERVERS,pre-matching
DOMAIN-KEYWORD,claude,LOCAL-SERVERS,pre-matching
DOMAIN-SUFFIX,anthropic.com,LOCAL-SERVERS,pre-matching
DOMAIN-SUFFIX,clau.de,LOCAL-SERVERS,pre-matching
DOMAIN,cdn.usefathom.com,LOCAL-SERVERS,pre-matching
DOMAIN-SUFFIX,sentry.io,LOCAL-SERVERS,pre-matching
IP-CIDR,160.79.104.0/21,LOCAL-SERVERS,no-resolve
IP-CIDR,2607:6BC0::/32,LOCAL-SERVERS,no-resolve
IP-ASN,399358,LOCAL-SERVERS,no-resolve
# OpenAI / ChatGPT
RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Shadowrocket/OpenAI/OpenAI.list,LOCAL-SERVERS,pre-matching
# Gemini / GitHub Copilot（不用可删）
RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Shadowrocket/Gemini/Gemini.list,LOCAL-SERVERS,pre-matching
RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Shadowrocket/Copilot/Copilot.list,LOCAL-SERVERS,pre-matching

# ───── [4] 国内直连（ChinaMax：域名 + IP 段 + ASN） ─────
RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Shadowrocket/ChinaMax/ChinaMax.list,DIRECT
DOMAIN-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Shadowrocket/ChinaMax/ChinaMax_Resolve.list,DIRECT
GEOIP,CN,DIRECT
# ───── 可选：屏蔽 QUIC/HTTP3（UDP 443）强制回落 TCP，代理链路通常更稳。
# 本 profile 大部分流量走代理，启用收益更明显；需要就去掉下一行开头的 #
# AND,((PROTOCOL,UDP),(DST-PORT,443)),REJECT

# ───── [5] 兜底：其余全部走代理（境外为主） ─────
FINAL,PROXY

[MITM]
h2 = false
enable = false
hostname =
ca-passphrase =
ca-p12 =
