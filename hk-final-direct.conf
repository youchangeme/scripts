# Shadowrocket: 2026-07-31  ——  香港网络环境专用
# ============================================================
# 定位：香港无墙，这份不是翻墙配置，而是「AI 服务 + 内网穿透」专用。
#   - Anthropic / OpenAI 不支持香港 IP（会封号或直接拒绝服务），
#     这两类流量在香港反而必须绕美国 VPS（Oracle Phoenix, AS31898）
#   - 其余一切直连，充分利用香港本地的国际出口
#
# 结构（自上而下匹配，先命中先生效）:
#   [1] 内网穿透   ZeroTier 网段 → 自有 VPS（LOCAL-SERVERS）+ 局域网 DIRECT 兜底
#   [2] 拦截       广告 + 运营商劫持
#   [3] AI 服务    Claude / OpenAI / Gemini / Copilot → 自有 VPS（香港 IP 会被拒）
#   [4] 兜底       FINAL,DIRECT
#
# 与另外两份的刻意差异:
#   - 无 Global / ChinaMax 列表：香港直连即可访问全球，多一层匹配纯属浪费
#   - 无 Telegram 规则：香港直连可用
#   - 无 raft.build 代理规则：同上
#   - prefer-ipv6 = true：香港 IPv6 普及度和质量都好，优先走 v6 通常更快
#
# 注意（重要）:
#   走 VPS 的流量是「香港 → 美国凤凰城」，往返延迟约 180-220ms，属正常现象。
#   不必为此另开亚洲节点：香港节点会拿到香港 IP，同样被 AI 厂商拒绝；日本/新加坡
#   虽在支持区，但 Anthropic / OpenAI 的服务端本身在美国（实测本机到 api.anthropic.com
#   仅 23ms、TTFB 66ms，说明 Phoenix 已贴着服务端），经东京中转仍要跨太平洋，
#   总时延只省 10-20%。这段延迟的下限是物理距离，换节点解决不了。
# 维护提示: 列表走 jsdelivr；广告拦截出问题删 [2] 两行
# ============================================================

[General]
# 香港本地公共 DNS（HKIX 内直连，延迟低）
fallback-dns-server = 1.1.1.1, 8.8.8.8
private-ip-answer = true
prefer-ipv6 = true
bypass-system = true
dns-server = system
# skip-proxy 是硬旁路（跳过规则强制直连，无例外机制）：
# 故意不含 10.0.0.0/8 和 192.168.0.0/16 —— ZeroTier 三个网段在里面，加了内网穿透就断；
# 普通局域网流量由 tun-excluded-routes 在路由层挡住，不依赖这里
skip-proxy = 127.0.0.1, 169.254.0.0/16, 172.16.0.0/12, 100.64.0.0/10, localhost, *.local, captive.apple.com, *.crashlytics.com, *.edu.cn
# ZeroTier 内网段精确打洞进 TUN；其余 192.168.x / 10.x 仍完全绕过（与默认行为一致）
tun-included-routes = 192.168.192.0/24, 10.21.0.0/16, 192.168.20.0/24
tun-excluded-routes = 10.0.0.0/8,100.64.0.0/10,127.0.0.0/8,169.254.0.0/16,172.16.0.0/12,192.0.0.0/24,192.0.2.0/24,192.88.99.0/24,192.168.0.0/16,198.18.0.0/15,198.51.100.0/24,203.0.113.0/24,224.0.0.0/4,255.255.255.255/32
ipv6 = true


[Proxy Group]
# select = 手动选择，App 里点一下即切；列表首个成员为默认值
# ⚠ 自有VPS 靠正则匹配你手动添加的节点（名字含 oracle-us）。
#   导入后先点开这个组确认里面有节点 —— 空的说明正则没匹配上，
#   把 oracle 换成节点名里的其它关键词即可。
# 内网穿透专用：必须钉死在加入了 ZeroTier 的那台（名字含 oracle-us）。
# ⚠ 绝不能用 url-test/fallback —— 其它自有节点没加入 ZeroTier，
#   一旦被自动选中，内网会静默不通（能连上代理，但访问不到内网设备）。
内网穿透 = select,policy-regex-filter=(?i)oracle-us
# AI 专用：fallback = 固定用第一个，只有它挂了才切。
# 不用 url-test：那会随延迟抖动在节点间跳来跳去，出口 IP 频繁变化，
# 恰好破坏「固定出口 IP 降 AI 风控」这个初衷。
自有VPS = fallback,policy-regex-filter=(?i)oracle,url=http://1.1.1.1/generate_204,interval=300,timeout=3
兜底分流 = select,DIRECT,自动选择,香港节点,日本节点,台湾节点,美国节点,狮城节点,interval=86400,timeout=3,select=0,url=http://1.1.1.1/generate_204

# 自动测速组：节点由正则从订阅里筛，机场改名/换节点都不用动配置
# ⚠ 每组都排除 oracle —— 那台是个人小机器，不该被随机挑中承载普通流量
自动选择 = url-test,policy-regex-filter=(?i)^(?!.*(oracle|过期|剩余|官网|试用|流量|到期)).*$,url=http://1.1.1.1/generate_204,interval=300,tolerance=50,timeout=3,select=0
香港节点 = url-test,policy-regex-filter=(?i)^(?!.*oracle)(?=.*(🇭🇰|香港|(HK|Hong))).*$,url=http://1.1.1.1/generate_204,interval=300,tolerance=50,timeout=3,select=0
台湾节点 = url-test,policy-regex-filter=(?i)^(?!.*oracle)(?=.*(🇹🇼|台湾|(TW|Taiwan))).*$,url=http://1.1.1.1/generate_204,interval=300,tolerance=50,timeout=3,select=0
日本节点 = url-test,policy-regex-filter=(?i)^(?!.*oracle)(?=.*(🇯🇵|日本|东京|(JP|Japan))).*$,url=http://1.1.1.1/generate_204,interval=300,tolerance=50,timeout=3,select=0
美国节点 = url-test,policy-regex-filter=(?i)^(?!.*oracle)(?=.*(🇺🇸|美国|洛杉矶|圣何塞|(US|United States))).*$,url=http://1.1.1.1/generate_204,interval=300,tolerance=50,timeout=3,select=0
狮城节点 = url-test,policy-regex-filter=(?i)^(?!.*oracle)(?=.*(🇸🇬|新加坡|狮城|(SG|Singapore))).*$,url=http://1.1.1.1/generate_204,interval=300,tolerance=50,timeout=3,select=0

[Rule]
# ───── [1] 内网穿透：出口必须是加入了 ZeroTier 的 Oracle VPS ─────
# （LOCAL-SERVERS 分组切到其它节点时内网会不通）
IP-CIDR,192.168.192.0/24,内网穿透,no-resolve
IP-CIDR,10.21.0.0/16,内网穿透,no-resolve
IP-CIDR,192.168.20.0/24,内网穿透,no-resolve
# 局域网兜底：正常情况下这些网段不进 TUN，这里保证调整 excluded 名单后依旧直连
IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
IP-CIDR,127.0.0.0/8,DIRECT,no-resolve

# ───── [2] 广告 + 运营商劫持拦截 ─────
RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Shadowrocket/AdvertisingLite/AdvertisingLite.list,REJECT,pre-matching
RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Shadowrocket/Hijacking/Hijacking.list,REJECT,pre-matching

# ───── [3] AI 服务 → 自有 VPS（香港 IP 被 Anthropic / OpenAI 拒绝） ─────
# Claude / Anthropic（维护列表 + 本地兜底：列表拉取失败时下面的手工规则仍然生效）
RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Shadowrocket/Claude/Claude.list,自有VPS,pre-matching
DOMAIN-KEYWORD,claude,自有VPS,pre-matching
DOMAIN-SUFFIX,anthropic.com,自有VPS,pre-matching
DOMAIN-SUFFIX,clau.de,自有VPS,pre-matching
DOMAIN,cdn.usefathom.com,自有VPS,pre-matching
DOMAIN-SUFFIX,sentry.io,自有VPS,pre-matching
IP-CIDR,160.79.104.0/21,自有VPS,no-resolve
IP-CIDR,2607:6BC0::/32,自有VPS,no-resolve
IP-ASN,399358,自有VPS,no-resolve
# OpenAI / ChatGPT
RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Shadowrocket/OpenAI/OpenAI.list,自有VPS,pre-matching
# Gemini / GitHub Copilot（Gemini 在香港可直连，仅为出口 IP 一致才走 VPS；不需要可删）
RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Shadowrocket/Gemini/Gemini.list,自有VPS,pre-matching
RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Shadowrocket/Copilot/Copilot.list,自有VPS,pre-matching

# ───── 可选：访问中国大陆服务嫌慢时启用（香港直连大陆走国际出口，绕行反而更快的情况很少，
# 默认不开）。需要就去掉下一行开头的 #，把大陆流量交给 DIRECT 之外的节点自行判断
# RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Shadowrocket/ChinaMax/ChinaMax.list,DIRECT

# ───── [4] 兜底：香港无墙，其余全部直连 ─────
FINAL,兜底分流

[MITM]
h2 = false
enable = false
hostname =
ca-passphrase =
ca-p12 =
